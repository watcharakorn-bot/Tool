<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เครื่องมือใช้งาน แผนกผลิตพลังงานไฟฟ้า — Vanachai Energy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#DDF1FF;
    --mint:#D4F7E1;
    --line:#B8DCE6;
    --accent:#0891B2;
    --accent-soft:rgba(8,145,178,.12);
    --brand:#0E7490;
    --text:#0B3440;
    --text-dim:#3F6570;
    --sans:'IBM Plex Sans Thai','Leelawadee UI','Tahoma',system-ui,sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:var(--sans);color:var(--text);background:var(--sky);}

  /* ---------- หน้าแรก ---------- */
  #home{
    position:fixed;inset:0;overflow-y:auto;
    background:
      radial-gradient(110% 60% at 90% -10%, rgba(255,255,255,.75), transparent 55%),
      linear-gradient(160deg, var(--sky) 0%, #E4F6F4 50%, var(--mint) 100%);
  }
  /* ภาพโรงไฟฟ้าชีวมวล ด้านล่างของหน้า */
  #home::before{
    content:"";position:fixed;left:0;right:0;bottom:0;height:100%;pointer-events:none;
    background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1200 600%22 preserveAspectRatio=%22xMidYMax slice%22%3E %3Cdefs%3E %3ClinearGradient id=%22hill1%22 x1=%220%22 y1=%220%22 x2=%220%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%23BFE8D6%22/%3E%3Cstop offset=%221%22 stop-color=%22%23A9DEC7%22/%3E%3C/linearGradient%3E %3ClinearGradient id=%22ground%22 x1=%220%22 y1=%220%22 x2=%220%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%239ED6B4%22/%3E%3Cstop offset=%221%22 stop-color=%22%237EC49C%22/%3E%3C/linearGradient%3E %3ClinearGradient id=%22bld%22 x1=%220%22 y1=%220%22 x2=%220%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%23E9F4F7%22/%3E%3Cstop offset=%221%22 stop-color=%22%23CFE3EA%22/%3E%3C/linearGradient%3E %3ClinearGradient id=%22pile%22 x1=%220%22 y1=%220%22 x2=%220%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%23E8C48E%22/%3E%3Cstop offset=%221%22 stop-color=%22%23C99A5E%22/%3E%3C/linearGradient%3E %3C/defs%3E %3C%21-- sun glow --%3E %3Ccircle cx=%22980%22 cy=%22150%22 r=%2270%22 fill=%22%23FFF7D6%22 opacity=%22.9%22/%3E %3Ccircle cx=%22980%22 cy=%22150%22 r=%22120%22 fill=%22%23FFF3C4%22 opacity=%22.35%22/%3E %3C%21-- far hills --%3E %3Cpath d=%22M0 400 C150 330 300 360 420 340 C560 315 680 370 820 340 C960 310 1080 350 1200 330 L1200 600 L0 600Z%22 fill=%22url%28%23hill1%29%22 opacity=%22.8%22/%3E %3C%21-- steam from chimney --%3E %3Cg fill=%22%23FFFFFF%22 opacity=%22.85%22%3E %3Cellipse cx=%22760%22 cy=%22150%22 rx=%2226%22 ry=%2218%22/%3E %3Cellipse cx=%22785%22 cy=%22122%22 rx=%2234%22 ry=%2222%22/%3E %3Cellipse cx=%22822%22 cy=%2298%22 rx=%2242%22 ry=%2226%22 opacity=%22.8%22/%3E %3Cellipse cx=%22870%22 cy=%2278%22 rx=%2248%22 ry=%2228%22 opacity=%22.6%22/%3E %3Cellipse cx=%22925%22 cy=%2264%22 rx=%2252%22 ry=%2226%22 opacity=%22.4%22/%3E %3C/g%3E %3C%21-- chimney --%3E %3Cpath d=%22M742 170 L778 170 L786 470 L734 470Z%22 fill=%22%23D8E8EE%22 stroke=%22%239CC3CF%22 stroke-width=%222%22/%3E %3Crect x=%22738%22 y=%22190%22 width=%2244%22 height=%228%22 fill=%22%23E57B5A%22 opacity=%22.75%22/%3E %3Crect x=%22740%22 y=%22214%22 width=%2240%22 height=%228%22 fill=%22%23FFFFFF%22/%3E %3C%21-- boiler house --%3E %3Crect x=%22560%22 y=%22250%22 width=%22150%22 height=%22220%22 fill=%22url%28%23bld%29%22 stroke=%22%239CC3CF%22 stroke-width=%222%22/%3E %3Cg fill=%22%239CD3E0%22 opacity=%22.85%22%3E %3Crect x=%22578%22 y=%22272%22 width=%2222%22 height=%2214%22/%3E%3Crect x=%22612%22 y=%22272%22 width=%2222%22 height=%2214%22/%3E%3Crect x=%22646%22 y=%22272%22 width=%2222%22 height=%2214%22/%3E%3Crect x=%22680%22 y=%22272%22 width=%2216%22 height=%2214%22/%3E %3Crect x=%22578%22 y=%22306%22 width=%2222%22 height=%2214%22/%3E%3Crect x=%22612%22 y=%22306%22 width=%2222%22 height=%2214%22/%3E%3Crect x=%22646%22 y=%22306%22 width=%2222%22 height=%2214%22/%3E%3Crect x=%22680%22 y=%22306%22 width=%2216%22 height=%2214%22/%3E %3C/g%3E %3Crect x=%22560%22 y=%22244%22 width=%22150%22 height=%2210%22 fill=%22%230891B2%22 opacity=%22.55%22/%3E %3C%21-- turbine hall --%3E %3Crect x=%22380%22 y=%22340%22 width=%22180%22 height=%22130%22 fill=%22url%28%23bld%29%22 stroke=%22%239CC3CF%22 stroke-width=%222%22/%3E %3Cpath d=%22M380 340 L470 312 L560 340Z%22 fill=%22%23CFE3EA%22 stroke=%22%239CC3CF%22 stroke-width=%222%22/%3E %3Cg fill=%22%239CD3E0%22 opacity=%22.85%22%3E%3Crect x=%22400%22 y=%22366%22 width=%22140%22 height=%2216%22/%3E%3C/g%3E %3Crect x=%22440%22 y=%22420%22 width=%2246%22 height=%2250%22 fill=%22%23B7D6E0%22/%3E %3C%21-- conveyor to boiler --%3E %3Cpath d=%22M890 440 L706 300%22 stroke=%22%237FAEBC%22 stroke-width=%2210%22 stroke-linecap=%22round%22/%3E %3Cpath d=%22M890 440 L706 300%22 stroke=%22%23E9F4F7%22 stroke-width=%223%22 stroke-dasharray=%2210 8%22/%3E %3Cg stroke=%22%237FAEBC%22 stroke-width=%223%22%3E%3Cline x1=%22850%22 y1=%22410%22 x2=%22850%22 y2=%22470%22/%3E%3Cline x1=%22790%22 y1=%22364%22 x2=%22790%22 y2=%22470%22/%3E%3Cline x1=%22740%22 y1=%22326%22 x2=%22740%22 y2=%22340%22/%3E%3C/g%3E %3C%21-- fuel piles %28wood chips%29 --%3E %3Cpath d=%22M840 470 C870 410 930 395 980 470Z%22 fill=%22url%28%23pile%29%22/%3E %3Cpath d=%22M930 470 C975 400 1050 390 1110 470Z%22 fill=%22url%28%23pile%29%22 opacity=%22.92%22/%3E %3Cg fill=%22%23B98547%22 opacity=%22.5%22%3E%3Ccircle cx=%22905%22 cy=%22440%22 r=%222.5%22/%3E%3Ccircle cx=%22925%22 cy=%22452%22 r=%222%22/%3E%3Ccircle cx=%221010%22 cy=%22430%22 r=%222.5%22/%3E%3Ccircle cx=%221050%22 cy=%22448%22 r=%222%22/%3E%3Ccircle cx=%221030%22 cy=%22455%22 r=%222%22/%3E%3Ccircle cx=%22890%22 cy=%22458%22 r=%222%22/%3E%3C/g%3E %3C%21-- transmission tower --%3E %3Cg stroke=%22%236FA3B3%22 stroke-width=%223%22 fill=%22none%22%3E %3Cpath d=%22M220 470 L250 250 L280 470%22/%3E %3Cpath d=%22M232 380 L268 380 M238 330 L262 330 M244 290 L256 290%22/%3E %3Cpath d=%22M226 430 L268 380 M274 430 L232 380 M236 380 L262 330 M264 380 L238 330%22/%3E %3Cpath d=%22M210 285 L290 285 M218 310 L282 310%22/%3E %3C/g%3E %3Cg stroke=%22%236FA3B3%22 stroke-width=%221.5%22 fill=%22none%22 opacity=%22.8%22%3E %3Cpath d=%22M0 300 Q110 330 210 285%22/%3E%3Cpath d=%22M290 285 Q340 305 380 320%22/%3E %3Cpath d=%22M0 325 Q110 355 218 310%22/%3E%3Cpath d=%22M282 310 Q330 330 380 345%22/%3E %3C/g%3E %3C%21-- trees --%3E %3Cg fill=%22%236DBF8E%22%3E %3Ccircle cx=%2260%22 cy=%22440%22 r=%2234%22/%3E%3Ccircle cx=%22105%22 cy=%22450%22 r=%2228%22/%3E%3Ccircle cx=%22330%22 cy=%22448%22 r=%2226%22/%3E %3Ccircle cx=%221150%22 cy=%22440%22 r=%2232%22/%3E%3Ccircle cx=%221185%22 cy=%22455%22 r=%2224%22/%3E%3Ccircle cx=%22520%22 cy=%22455%22 r=%2220%22/%3E %3C/g%3E %3Cg fill=%22%238B6A4A%22%3E%3Crect x=%2257%22 y=%22465%22 width=%226%22 height=%2212%22/%3E%3Crect x=%22102%22 y=%22470%22 width=%226%22 height=%2210%22/%3E%3Crect x=%22327%22 y=%22468%22 width=%226%22 height=%2210%22/%3E%3Crect x=%221147%22 y=%22462%22 width=%226%22 height=%2214%22/%3E%3C/g%3E %3C%21-- ground --%3E %3Cpath d=%22M0 470 C300 460 700 478 1200 466 L1200 600 L0 600Z%22 fill=%22url%28%23ground%29%22/%3E %3Cpath d=%22M0 520 C350 505 800 530 1200 512 L1200 600 L0 600Z%22 fill=%22%236FB98E%22 opacity=%22.45%22/%3E %3C/svg%3E");
    background-repeat:no-repeat;background-position:center bottom;background-size:100% auto;
    opacity:.95;
  }
  @media (max-width:760px){
    #home .home-inner{padding-bottom:calc(100vw * .5 + 10px + env(safe-area-inset-bottom,0px));}
  }
  .home-inner{
    position:relative;max-width:620px;margin:0 auto;
    padding:calc(48px + env(safe-area-inset-top,0px)) 20px calc(60px + env(safe-area-inset-bottom,0px));
  }
  .brand{color:var(--brand);font-size:14px;font-weight:500;margin:0 0 10px;}
  .home-inner h1{
    font-size:clamp(28px,7vw,38px);line-height:1.2;font-weight:700;margin:0 0 8px;letter-spacing:-.01em;
  }
  .lead{color:var(--text-dim);font-size:15px;margin:0 0 30px;line-height:1.6;}

  .topics{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;}
  .topic{
    display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:rgba(255,255,255,.82);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    border:1px solid var(--line);border-left:4px solid var(--accent);
    box-shadow:0 2px 10px rgba(8,145,178,.08);
    border-radius:12px;padding:16px 16px 16px 18px;
    color:var(--text);font-family:inherit;cursor:pointer;
    transition:border-color .15s, background .15s, transform .1s;
  }
  .topic:hover{border-color:var(--accent);background:#fff;}
  .topic:active{transform:scale(.99);}
  .topic:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
  .topic-text{flex:1;min-width:0;}
  .topic-title{display:block;font-size:16.5px;font-weight:600;line-height:1.4;margin-bottom:4px;}
  .topic-desc{display:block;font-size:13.5px;color:var(--text-dim);line-height:1.5;}
  .chev{flex:0 0 auto;width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft);color:var(--accent);font-size:18px;font-weight:600;}
  .foot{margin-top:28px;font-size:12.5px;color:var(--text-dim);}
  .credit{margin-top:36px;text-align:center;font-size:11.5px;color:#0B3440;letter-spacing:.02em;position:relative;}

  /* ---------- หน้าทำงาน ---------- */
  #work{position:fixed;inset:0;display:none;background:#fff;}
  #work.show{display:block;}
  #work iframe{width:100%;height:100%;border:0;display:none;}
  #work iframe.active{display:block;}
  .offline{display:none;position:absolute;inset:0;z-index:5;align-items:center;justify-content:center;flex-direction:column;
    text-align:center;padding:24px;background:var(--sky);color:var(--text);font-size:17px;font-weight:600;line-height:1.6;}
  .offline small{font-size:14px;font-weight:400;color:var(--text-dim);}
  .offline.show{display:flex;}
  .back{
    position:fixed;z-index:10;
    left:calc(14px + env(safe-area-inset-left,0px));
    bottom:calc(16px + env(safe-area-inset-bottom,0px));
    display:flex;align-items:center;gap:6px;
    background:var(--accent);color:#fff;
    border:1px solid var(--brand);border-radius:999px;
    padding:10px 16px 10px 12px;font-family:inherit;font-size:14px;font-weight:600;
    box-shadow:0 6px 20px rgba(0,0,0,.35);cursor:pointer;
  }
  .back:focus-visible{outline:2px solid var(--brand);outline-offset:3px;}
  .back span{color:#fff;font-size:18px;line-height:1;}
  @media (prefers-reduced-motion:reduce){ .topic{transition:none;} }
</style>
</head>
<body>

<div id="home">
  <div class="home-inner">
    <p class="brand">Vanachai Energy — โรงไฟฟ้าชีวมวล 9.9 MW</p>
    <h1>เครื่องมือใช้งาน แผนกผลิตพลังงานไฟฟ้า</h1>
    <p class="lead">เลือกงานที่ต้องการเพื่อเปิดหน้าทำงาน</p>
    <ul class="topics" id="topics"></ul>
    <p class="foot" id="count"></p>
    <p class="credit">Watcharakorn Jingjai</p>
  </div>
</div>

<div id="work">
  <div class="offline" id="offline">ไม่มีการเชื่อมต่ออินเทอร์เน็ต<br><small>หัวข้อนี้เปิดจาก GitHub ต้องต่อเน็ตก่อน แล้วกดเข้าหัวข้อใหม่อีกครั้ง</small></div>
  <button class="back" id="back" type="button"><span>‹</span>หน้ารวม</button>
</div>



<script>
const TOPICS = [
  {
    "id": "fuel-mw",
    "title": "ประเมินเชื้อเพลิง ↔ กำลังผลิตไฟฟ้า 9.9 MW",
    "desc": "คำนวณไฟฟ้าที่ได้จากเชื้อเพลิงผสม และเชื้อเพลิงที่ต้องใช้ตามเป้า MW",
    "url": "https://watcharakorn-bot.github.io/Calculate-Fuel-to-MW./"
  },
  {
    "id": "dry-bulk",
    "title": "แบบฟอร์มบันทึกค่า Dry Bulk Density",
    "desc": "บันทึกน้ำหนัก ความชื้น ปริมาตร พร้อมรูปถ่าย และพิมพ์ใบรายงาน คิดจากปริมาตรรถตัก",
    "url": "https://watcharakorn-bot.github.io/Calculate-Bulk-Density/"
  },
  {
    "id": "wet-bulk",
    "title": "บันทึก Wet Bulk Density เชื้อเพลิง",
    "desc": "บันทึกค่า Wet Bulk Density รายชนิดเชื้อเพลิง และเก็บประวัติการวัด",
    "url": "https://watcharakorn-bot.github.io/Wet-Bulk-Density/"
  },
  {
    "id": "area-issue",
    "title": "รายงานปัญหาพื้นที่ที่อยู่ในสภาพไม่สมบูรณ์",
    "desc": "บันทึกและสร้างรายงานพื้นที่ที่ชำรุดหรือต้องแก้ไข",
    "url": "https://watcharakorn-bot.github.io/Form-5S/"
  },
  {
    "id": "heat-value",
    "title": "การคำนวณหาค่าความร้อนเชื้อเพลิง",
    "desc": "ประเมินปริมาตร น้ำหนัก และค่าความร้อนของกองเชื้อเพลิง",
    "url": "https://watcharakorn-bot.github.io/LHV_Volume/"
  },
  {
    "id": "fuel-remaining",
    "title": "ประเมินเชื้อเพลิงคงเหลือ",
    "desc": "ประเมินน้ำหนักวัสดุในกองด้วยสายตา",
    "url": "https://watcharakorn-bot.github.io/Volume-Fuel/"
  },
  {
    "id": "pile-label",
    "title": "ป้ายชื่อกองเชื้อเพลิง",
    "desc": "สร้างป้ายกองวัตถุดิบ ใช้งานบน iPhone ได้",
    "url": "https://watcharakorn-bot.github.io/Name-Fuel/"
  }
];
const home = document.getElementById('home');
const work = document.getElementById('work');
const frames = {};

function openTopic(id){
  const t = TOPICS.find(x => x.id === id);
  if(!frames[id]){
    const f = document.createElement('iframe');
    f.title = t.title;
    f.setAttribute('allow', 'web-share; clipboard-write; camera; fullscreen');
    f.src = t.url;
    work.appendChild(f);
    frames[id] = f;
  }
  Object.values(frames).forEach(f => f.classList.toggle('active', f === frames[id]));
  document.getElementById('offline').classList.toggle('show', !navigator.onLine);
  home.style.display = 'none';
  work.classList.add('show');
  document.title = t.title;
}

function goHome(){
  work.classList.remove('show');
  if(!navigator.onLine){ Object.keys(frames).forEach(k => { frames[k].remove(); delete frames[k]; }); }
  home.style.display = '';
  document.title = 'เครื่องมือใช้งาน แผนกผลิตพลังงานไฟฟ้า — Vanachai Energy';
}

const list = document.getElementById('topics');
TOPICS.forEach((t, i) => {
  const li = document.createElement('li');
  const b = document.createElement('button');
  b.className = 'topic'; b.type = 'button';
  b.innerHTML = '<span class="topic-text"><span class="topic-title"></span><span class="topic-desc"></span></span><span class="chev">›</span>';
  b.querySelector('.topic-title').textContent = (i + 1) + '. ' + t.title;
  b.querySelector('.topic-desc').textContent = t.desc;
  b.onclick = () => openTopic(t.id);
  li.appendChild(b); list.appendChild(li);
});
document.getElementById('count').textContent = 'ทั้งหมด ' + TOPICS.length + ' หัวข้อ';
document.getElementById('back').onclick = goHome;
</script>
</body>
</html>
